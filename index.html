    <script>
      (function() {
        // Fix for "Cannot set property fetch of #<Window> which has only a getter" & ipapi.co "Rate exceeded" issue
        try {
          var _origFetch = window.fetch;

          function handleFetch(input, init) {
            var url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
            if (url && (url.indexOf('ipapi.co') !== -1 || url.indexOf('ipify.org') !== -1)) {
              var mockGeo = {
                ip: "177.0.0.1",
                country: "BR",
                country_code: "BR",
                country_name: "Brazil"
              };
              return Promise.resolve(new Response(JSON.stringify(mockGeo), {
                status: 200,
                statusText: "OK",
                headers: { "Content-Type": "application/json" }
              }));
            }
            return _origFetch ? _origFetch.apply(this, arguments) : Promise.reject(new Error('fetch unavailable'));
          }

          var _currentFetch = handleFetch;

          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(newFetch) {
              if (typeof newFetch === 'function') {
                _currentFetch = function(input, init) {
                  var url = typeof input === 'string' ? input : (input && input.url ? input.url : '');
                  if (url && (url.indexOf('ipapi.co') !== -1 || url.indexOf('ipify.org') !== -1)) {
                    var mockGeo = {
                      ip: "177.0.0.1",
                      country: "BR",
                      country_code: "BR",
                      country_name: "Brazil"
                    };
                    return Promise.resolve(new Response(JSON.stringify(mockGeo), {
                      status: 200,
                      statusText: "OK",
                      headers: { "Content-Type": "application/json" }
                    }));
                  }
                  return newFetch.apply(this, arguments);
                };
              } else {
                _currentFetch = newFetch;
              }
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {
          console.warn('Fetch interceptor init:', err);
        }

        // Safe patch for JSON.stringify against circular references
        var originalStringify = JSON.stringify;
        JSON.stringify = function(value, replacer, space) {
          var cache = new WeakSet();
          function safeReplacer(key, val) {
            if (typeof val === 'object' && val !== null) {
              if (typeof Node !== 'undefined' && val instanceof Node) {
                return '[DOM Element]';
              }
              if (cache.has(val)) {
                return '[Circular]';
              }
              cache.add(val);
            }
            if (typeof replacer === 'function') {
              return replacer.call(this, key, val);
            }
            return val;
          }
          try {
            return originalStringify(value, typeof replacer === 'function' ? safeReplacer : replacer, space);
          } catch (err) {
            try {
              return originalStringify(value, safeReplacer, space);
            } catch (err2) {
              return 'null';
            }
          }
        };
      })();
