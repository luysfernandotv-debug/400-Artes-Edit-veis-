<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE0AD"/>
      <stop offset="50%" stop-color="#DDA853"/>
      <stop offset="100%" stop-color="#9A6F1A"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  
  <!-- Border -->
  <rect x="15" y="15" width="470" height="470" rx="15" fill="none" stroke="url(#gold-grad)" stroke-width="2" opacity="0.8"/>
  <rect x="22" y="22" width="456" height="456" rx="10" fill="none" stroke="#DDA853" stroke-width="0.5" opacity="0.2" stroke-dasharray="4 4"/>
  
  <!-- Header -->
  <g transform="translate(250, 70)" text-anchor="middle">
    <text font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="900" font-size="11" letter-spacing="4" fill="url(#gold-grad)" y="-15">MONUMENTAL LEAGUE</text>
    <text font-family="'Impact', 'Arial Black', sans-serif" font-size="34" letter-spacing="2" fill="#ffffff" y="20">PARCEIROS OFICIAIS</text>
    <text font-family="'Inter', sans-serif" font-weight="500" font-size="10" letter-spacing="6" fill="#DDA853" opacity="0.9" y="38">APOIADORES DO CAMPEONATO</text>
    <line x1="-80" y1="48" x2="80" y2="48" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Partners Grid (4 elegant card placeholders with text or icons) -->
  <g transform="translate(50, 160)">
    <!-- Sponsor 1: Nike style -->
    <g transform="translate(0, 0)">
      <rect width="180" height="110" rx="10" fill="#0c0c0c" stroke="#222" stroke-width="1"/>
      <!-- swoosh shape -->
      <path d="M 50,60 Q 90,45 130,35 Q 90,65 60,75 Z" fill="#666" opacity="0.4"/>
      <text font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle" x="90" y="55">SPORTS Co.</text>
      <text font-family="'Inter', sans-serif" font-size="8" letter-spacing="3" fill="#DDA853" text-anchor="middle" x="90" y="75">MASTER SPONSOR</text>
    </g>

    <!-- Sponsor 2: Gatorade style -->
    <g transform="translate(220, 0)">
      <rect width="180" height="110" rx="10" fill="#0c0c0c" stroke="#222" stroke-width="1"/>
      <path d="M 90,30 L 105,50 H 95 L 100,75 L 80,55 H 90 Z" fill="#DDA853" opacity="0.4"/>
      <text font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle" x="90" y="55">ENERGY+</text>
      <text font-family="'Inter', sans-serif" font-size="8" letter-spacing="3" fill="#DDA853" text-anchor="middle" x="90" y="75">OFFICIAL HYDRATION</text>
    </g>

    <!-- Sponsor 3: Puma style -->
    <g transform="translate(0, 140)">
      <rect width="180" height="110" rx="10" fill="#0c0c0c" stroke="#222" stroke-width="1"/>
      <circle cx="90" cy="50" r="18" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
      <text font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle" x="90" y="55">STRIKER</text>
      <text font-family="'Inter', sans-serif" font-size="8" letter-spacing="3" fill="#DDA853" text-anchor="middle" x="90" y="75">EQUIPMENTS</text>
    </g>

    <!-- Sponsor 4: Red Bull style -->
    <g transform="translate(220, 140)">
      <rect width="180" height="110" rx="10" fill="#0c0c0c" stroke="#222" stroke-width="1"/>
      <text font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle" x="90" y="55">VOLT ARENA</text>
      <text font-family="'Inter', sans-serif" font-size="8" letter-spacing="3" fill="#DDA853" text-anchor="middle" x="90" y="75">OFFICIAL STADIUM</text>
    </g>
  </g>
  
  <!-- Footer Brand -->
  <g transform="translate(250, 450)" text-anchor="middle">
    <text font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="9" letter-spacing="3" fill="#666666">ELITE FOOTBALL CREATIVE</text>
  </g>
</svg>
