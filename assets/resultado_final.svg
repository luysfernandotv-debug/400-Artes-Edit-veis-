<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE0AD"/>
      <stop offset="50%" stop-color="#DDA853"/>
      <stop offset="100%" stop-color="#9A6F1A"/>
    </linearGradient>
    <radialGradient id="score-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DDA853" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  
  <!-- Border -->
  <rect x="15" y="15" width="470" height="470" rx="15" fill="none" stroke="url(#gold-grad)" stroke-width="2" opacity="0.8"/>
  <rect x="22" y="22" width="456" height="456" rx="10" fill="none" stroke="#DDA853" stroke-width="0.5" opacity="0.2" stroke-dasharray="4 4"/>
  
  <!-- Header -->
  <g transform="translate(250, 70)" text-anchor="middle">
    <text font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="900" font-size="11" letter-spacing="4" fill="url(#gold-grad)" y="-15">MONUMENTAL LEAGUE</text>
    <text font-family="'Impact', 'Arial Black', sans-serif" font-size="34" letter-spacing="2" fill="#ffffff" y="20">RESULTADO FINAL</text>
    <text font-family="'Inter', sans-serif" font-weight="500" font-size="10" letter-spacing="6" fill="#DDA853" opacity="0.9" y="38">PLACAR DE COBERTURA OFICIAL</text>
    <line x1="-80" y1="48" x2="80" y2="48" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Score Board area -->
  <rect x="50" y="160" width="400" height="150" rx="12" fill="#0c0c0c" stroke="#222" stroke-width="1.5"/>
  <rect x="50" y="160" width="400" height="150" fill="url(#score-glow)"/>
  
  <!-- Team 1: ELITE FC -->
  <g transform="translate(110, 235)" text-anchor="middle">
    <text font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="20" fill="#ffffff">ELITE FC</text>
    <text font-family="'Inter', sans-serif" font-weight="700" font-size="8" fill="url(#gold-grad)" letter-spacing="2" y="20">CASA</text>
    <text font-family="'Inter', sans-serif" font-size="7" fill="#666" y="36">Lucas Santos (3)</text>
    <text font-family="'Inter', sans-serif" font-size="7" fill="#666" y="46">Rafael Almeida (2)</text>
  </g>

  <!-- Center score digits -->
  <g transform="translate(250, 230)" text-anchor="middle">
    <!-- Home Score -->
    <rect x="-55" y="-35" width="40" height="60" rx="6" fill="#121212" stroke="url(#gold-grad)" stroke-width="2"/>
    <text font-family="'Impact', 'Arial Black', sans-serif" font-size="44" fill="url(#gold-grad)" x="-35" y="12">8</text>
    
    <!-- Separator x -->
    <text font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#444" x="0" y="5">x</text>
    
    <!-- Away Score -->
    <rect x="15" y="-35" width="40" height="60" rx="6" fill="#121212" stroke="url(#gold-grad)" stroke-width="2"/>
    <text font-family="'Impact', 'Arial Black', sans-serif" font-size="44" fill="url(#gold-grad)" x="35" y="12">5</text>
  </g>

  <!-- Team 2: MONUMENTAL FC -->
  <g transform="translate(390, 235)" text-anchor="middle">
    <text font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="18" fill="#ffffff">MONUMENTAL</text>
    <text font-family="'Inter', sans-serif" font-weight="700" font-size="8" fill="#888" letter-spacing="2" y="20">VISITANTE</text>
    <text font-family="'Inter', sans-serif" font-size="7" fill="#666" y="36">Diego Costa (2)</text>
    <text font-family="'Inter', sans-serif" font-size="7" fill="#666" y="46">João Ferreira (1)</text>
  </g>

  <!-- Stats details below -->
  <g transform="translate(250, 360)" text-anchor="middle">
    <text font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="#ffffff" letter-spacing="2">RODADA 12 • FASE DE GRUPOS</text>
    <text font-family="'Inter', sans-serif" font-weight="500" font-size="9" fill="url(#gold-grad)" y="16">FESTIVAL DE GOLS DA RODADA</text>
  </g>
  
  <!-- Footer Brand -->
  <g transform="translate(250, 460)" text-anchor="middle">
    <text font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="9" letter-spacing="3" fill="#666666">ELITE FOOTBALL CREATIVE</text>
  </g>
</svg>
