<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE0AD"/>
      <stop offset="50%" stop-color="#DDA853"/>
      <stop offset="100%" stop-color="#9A6F1A"/>
    </linearGradient>
    <radialGradient id="vs-glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#DDA853" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#DDA853" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  
  <!-- Border -->
  <rect x="15" y="15" width="470" height="470" rx="15" fill="none" stroke="url(#gold-grad)" stroke-width="2" opacity="0.8"/>
  <rect x="22" y="22" width="456" height="456" rx="10" fill="none" stroke="#DDA853" stroke-width="0.5" opacity="0.2" stroke-dasharray="4 4"/>
  
  <!-- Header -->
  <g transform="translate(250, 70)" text-anchor="middle">
    <text font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="900" font-size="11" letter-spacing="4" fill="url(#gold-grad)" y="-15">MONUMENTAL LEAGUE</text>
    <text font-family="'Impact', 'Arial Black', sans-serif" font-size="34" letter-spacing="2" fill="#ffffff" y="20">PRÓXIMA RODADA</text>
    <text font-family="'Inter', sans-serif" font-weight="500" font-size="10" letter-spacing="6" fill="#DDA853" opacity="0.9" y="38">CONFRONTO DA SEMANA</text>
    <line x1="-80" y1="48" x2="80" y2="48" stroke="url(#gold-grad)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Matchup layout -->
  <!-- Center VS Glow -->
  <circle cx="250" cy="240" r="80" fill="url(#vs-glow)"/>
  
  <!-- Left Team: Elite FC -->
  <g transform="translate(110, 240)">
    <!-- Shield Outline -->
    <path d="M-40,-50 L40,-50 L40,0 C40,25 0,50 0,50 C0,50 -40,25 -40,0 Z" fill="#080808" stroke="url(#gold-grad)" stroke-width="2"/>
    <text font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="12" fill="url(#gold-grad)" text-anchor="middle" y="-20">ELITE</text>
    <text font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle" y="-5">FC</text>
    <!-- Star badge -->
    <path d="M0,-35 L3,-28 L10,-28 L5,-24 L7,-17 L0,-21 L-7,-17 L-5,-24 L-10,-28 L-3,-28 Z" fill="url(#gold-grad)"/>
    <!-- Team Label Below -->
    <text font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" y="75">ELITE FC</text>
    <text font-family="'Inter', sans-serif" font-size="9" fill="#888" text-anchor="middle" y="90">CASA</text>
  </g>

  <!-- Center VS Text -->
  <g transform="translate(250, 240)">
    <circle r="25" fill="#0c0c0c" stroke="url(#gold-grad)" stroke-width="1.5"/>
    <text font-family="'Impact', sans-serif" font-size="20" fill="url(#gold-grad)" text-anchor="middle" y="7">VS</text>
  </g>

  <!-- Right Team: Monumental FC -->
  <g transform="translate(390, 240)">
    <!-- Shield Outline -->
    <path d="M-40,-50 L40,-50 L40,0 C40,25 0,50 0,50 C0,50 -40,25 -40,0 Z" fill="#080808" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <text font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="11" fill="#ffffff" text-anchor="middle" y="-20">MONUM.</text>
    <text font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle" y="-5">FC</text>
    <!-- Stars -->
    <circle cx="-10" cy="-35" r="2" fill="#fff"/>
    <circle cx="0" cy="-38" r="2" fill="#fff"/>
    <circle cx="10" cy="-35" r="2" fill="#fff"/>
    <!-- Team Label Below -->
    <text font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="16" fill="#ffffff" text-anchor="middle" y="75">MONUMENTAL</text>
    <text font-family="'Inter', sans-serif" font-size="9" fill="#888" text-anchor="middle" y="90">VISITANTE</text>
  </g>

  <!-- Match Info Box -->
  <g transform="translate(250, 380)" text-anchor="middle">
    <rect x="-130" y="-18" width="260" height="36" rx="6" fill="#0f0f0f" stroke="#222" stroke-width="1"/>
    <text font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" fill="url(#gold-grad)" y="4">SÁBADO • 16:00 • ARENA CENTRAL</text>
    <text font-family="'Inter', sans-serif" font-weight="500" font-size="8" fill="#666" y="14">ENTRADA FRANCA PARA SÓCIOS</text>
  </g>
  
  <!-- Footer Brand -->
  <g transform="translate(250, 460)" text-anchor="middle">
    <text font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="9" letter-spacing="3" fill="#666666">ELITE FOOTBALL CREATIVE</text>
  </g>
</svg>
